# encoding: utf-8
---
recipe:
  Rx: flypy
  args: []
  description: >-
    雾凇拼音 + 小鹤双拼的个人偏好补丁。
    前置：rime-install iDvel/rime-ice:others/recipes/full
      - 候选词 7 个
      - 字号 12/12/11（皮肤不在此设定，由「输入法设定」界面选择）
      - 默认英文标点
      - 输入框显示双拼原码，不展开为全拼

patch_files:
  default.custom.yaml:
    - patch/+:
        menu/page_size: 7

  weasel.custom.yaml:
    - patch/+:
        style/font_point: 12
        style/label_font_point: 12
        style/comment_font_point: 11

  double_pinyin_flypy.custom.yaml:
    - patch/+:
        "switches/@1/reset": 1
        "translator/preedit_format": []

  rime_ice.custom.yaml:
    - patch/+:
        "switches/@1/reset": 1
